[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcloud-api"
version = "0.1.0"
description = "Python SDK and CLI for the SURF ResearchCloud API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp",
  "PyYAML",
  "python-dotenv",
]

[project.scripts]
researchcloud = "researchcloud.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
